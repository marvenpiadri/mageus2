name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Smoke-test the server-rendered home page
        run: |
          set -euo pipefail
          NG_ALLOWED_HOSTS=localhost PORT=4173 node dist/mageus2/server/server.mjs > /tmp/mageus-ssr.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          status=000
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --output /tmp/mageus-home.html --write-out '%{http_code}' http://localhost:4173/ || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            echo "SSR smoke test returned HTTP $status"
            cat /tmp/mageus-ssr.log
            cat /tmp/mageus-home.html || true
            exit 1
          fi
          grep -q 'THE MAGEUS READING ROOM' /tmp/mageus-home.html
          grep -q 'Ideas deserve' /tmp/mageus-home.html
  api-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mageus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mageus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mageus_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply every migration to a clean PostgreSQL database
        run: |
          set -euo pipefail
          for migration in apps/api/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 --file "${migration}"
          done
      - name: Verify magazine and rating schema exists
        run: |
          psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 --command "SELECT 'magazines'::regclass, 'magazine_issues'::regclass, 'magazine_issue_articles'::regclass, 'article_vote_summaries'::regclass"
