name: Mageus verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build Angular SSR application
        run: npm run build
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund
      - name: Check API syntax and tests
        working-directory: apps/api
        run: npm run check
